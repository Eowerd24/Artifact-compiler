[project]
name = "soloctl"
version = "0.1.0"
description = "Local-first artifact compiler backend: imports transcripts, extracts artifacts, emits a draft/approved library."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "markdown-it-py>=3.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
soloctl = "soloctl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soloctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
